<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gigster Freelancer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="ambient"></div>
    <div class="app">
      <header class="brand">
        <span class="platform-top">Freelancer</span>
        <div class="brand-row">
          <span class="logo">Gigster</span>
          <span class="tag">Inbox</span>
        </div>
      </header>

      <section id="login-view" class="card">
        <h1>Welcome back</h1>
        <p class="muted">One login for dashboard and extension. Use @nickname or email.</p>
        <form id="login-form">
          <label>
            <span>@nickname or email</span>
            <input id="identifier" name="identifier" placeholder="@jordan or you@email.com" required />
          </label>
          <label>
            <span>Password</span>
            <input id="password" name="password" type="password" placeholder="••••••••" required />
          </label>
          <p id="login-error" class="error hidden" role="alert"></p>
          <button type="submit" class="btn-primary" id="login-btn">Log in</button>
        </form>
      </section>

      <section id="main-view" class="card hidden">
        <p class="muted user-line">Signed in as <strong id="user-label"></strong></p>

        <div class="mode-toggle" role="group" aria-label="Inbox mode">
          <button type="button" class="mode-btn active" id="mode-manual" data-mode="manual">Manual</button>
          <button type="button" class="mode-btn" id="mode-auto" data-mode="auto">Auto</button>
        </div>
        <p class="mode-hint" id="mode-hint">Manual — AI drafts; you copy &amp; send on Freelancer.</p>

        <div id="auto-disclaimer" class="auto-disclaimer hidden">
          <label class="disclaimer-label">
            <input type="checkbox" id="auto-disclaimer-check" />
            <span>
              I understand that long-term use of Auto mode may lead to my Freelancer profile being banned.
            </span>
          </label>
        </div>

        <p id="queue-badge" class="watch-badge hidden">Running — unanswered chats one by one</p>
        <button type="button" class="btn-primary" id="start-btn">Start</button>
        <button type="button" class="btn-secondary hidden" id="stop-btn">Stop</button>

        <div id="draft-panel" class="draft-panel hidden">
          <div class="draft-head">
            <span id="draft-client" class="draft-client">Client</span>
            <span id="draft-score" class="draft-score"></span>
          </div>
          <textarea id="draft-text" class="draft-text" readonly rows="6" placeholder="AI draft appears here…"></textarea>
          <button type="button" class="btn-primary" id="copy-btn">Copy draft</button>
        </div>

        <div id="brief-choice-panel" class="brief-choice hidden">
          <p class="brief-choice-title">Brief ready — choose next step</p>
          <div class="brief-choice-actions">
            <button type="button" class="btn-primary" id="brief-build-btn">Build site (Agent 2)</button>
            <button type="button" class="btn-secondary" id="brief-doc-btn">Download client brief</button>
            <button type="button" class="btn-secondary" id="brief-both-btn">Both</button>
          </div>
          <p id="brief-choice-status" class="muted brief-choice-status"></p>
        </div>

        <p id="status" class="status">Press Start — extension handles the rest</p>
        <button type="button" class="btn-ghost" id="logout-btn">Sign out</button>
      </section>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
