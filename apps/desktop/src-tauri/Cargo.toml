[package]
name = "gigster-desktop"
version = "0.1.0"
description = "Gigster Desktop — tab monitor + OCR + Manual/Auto"
authors = ["Gigster"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
rand = "0.8"

[lib]
name = "gigster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gigster-desktop"
path = "src/main.rs"
